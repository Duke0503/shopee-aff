name: CI/CD Auto Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to Windows VPS
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy & Sync to Production Directory
        shell: powershell
        run: |
          $prodDir = "C:\Project\mmo"
          Write-Host ">>> [1/4] Kiem tra thu muc ung dung $prodDir..."
          if (Test-Path $prodDir) {
            Set-Location $prodDir
            
            Write-Host ">>> [2/4] Dong bo ma nguon moi nhat tu Git..."
            git fetch origin main
            git reset --hard origin/main
            
            Write-Host ">>> [3/4] Cai dat va cap nhat goi thu vien (uv sync & npm install)..."
            uv sync
            if (Test-Path "$prodDir\zalo_assistant\package.json") {
              Set-Location "$prodDir\zalo_assistant"
              npm install --omit=dev
              Set-Location $prodDir
            }
            
            Write-Host ">>> [4/4] Khoi dong lai Backend & Zalo Assistant Bot..."
            powershell -ExecutionPolicy Bypass -File "$prodDir\scripts\start-all.ps1" -CodeOnly
          } else {
            Write-Host ">>> Thu muc $prodDir chua ton tai, chay tren workspace hien tai..."
            uv sync
            cd zalo_assistant
            npm install --omit=dev
          }

      - name: Send Telegram Notification
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
        shell: powershell
        run: |
          try {
            $shortSha = if ($env:SHA) { $env:SHA.Substring(0, 7) } else { "latest" }
            $cleanMsg = if ($env:COMMIT_MSG) { $env:COMMIT_MSG.Split("`n")[0] } else { "Deploy tu dong" }
            
            $msg = "🚀 <b>[CI/CD DEPLOY THÀNH CÔNG]</b>`n`n" +
                   "📦 <b>Nhánh:</b> <code>main</code>`n" +
                   "📝 <b>Commit:</b> <code>$shortSha</code> - $cleanMsg`n" +
                   "👤 <b>Tác giả:</b> $env:ACTOR`n" +
                   "⏱ <b>Thời gian:</b> $(Get-Date -Format 'HH:mm:ss dd/MM/yyyy')`n`n" +
                   "✅ <i>Mã nguồn trên VPS đã được tự động cập nhật và nạp lại dịch vụ mới nhất!</i>"
            
            $envPath = "C:\Project\mmo\.env"
            if (Test-Path $envPath) {
                $botToken = ""
                $devChatId = ""
                Get-Content $envPath | ForEach-Object {
                    if ($_ -match "^TELEGRAM_BOT_TOKEN=(.+)$") { $botToken = $Matches[1].Trim() }
                    if ($_ -match "^TELEGRAM_DEV_CHAT_ID=(.+)$") { $devChatId = $Matches[1].Trim() }
                    if (-not $devChatId -and $_ -match "^TELEGRAM_CHAT_ID=(.+)$") { $devChatId = $Matches[1].Trim() }
                }
                if ($botToken -and $devChatId) {
                    $body = @{ chat_id = $devChatId; text = $msg; parse_mode = "HTML" } | ConvertTo-Json
                    Invoke-RestMethod -Uri "https://api.telegram.org/bot$botToken/sendMessage" -Method Post -ContentType "application/json" -Body $body | Out-Null
                }
            }
          } catch {
            Write-Host "Warning: Failed to send Telegram notification: $_"
          }
