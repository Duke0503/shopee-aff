name: Deploy to VPS

# Every push to main deploys the new platform to the production VPS through the self-hosted runner
# there (ops/windows/deploy.ps1): build first, then stop, mirror, install, start, and check health
# and that exactly one Zalo assistant runs. A deploy never overlaps another.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Deploy
        shell: powershell
        env:
          USERPROFILE: C:\Users\Administrator
          HOME: C:\Users\Administrator
          LOCALAPPDATA: C:\Users\Administrator\AppData\Local
        run: powershell -NoProfile -ExecutionPolicy Bypass -File .\ops\windows\deploy.ps1 -Source "$env:GITHUB_WORKSPACE"
      - name: Bridge changed
        shell: powershell
        run: |
          $changed = git diff --name-only HEAD~1 HEAD -- apps/bridge
          if ($changed) { Write-Host "::warning::The browser extension changed: reload Cashback Bridge in edge://extensions on the VPS." }
