<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#047857" />
    <link rel="icon" href="/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;subset=vietnamese&amp;display=swap" />
    <title></title>
  </head>
  <body>
    <div id="root">
      <!-- First-load skeleton (W7): the shell's shapes until the script runs; no text. -->
      <div class="min-h-dvh bg-background" aria-busy="true" data-skeleton>
        <div class="flex h-14 items-center gap-2.5 border-b border-border bg-card px-4 md:px-6">
          <img src="/logo-mark-64.webp" alt="" width="32" height="32" class="size-8 rounded-[10px]" />
          <div class="h-4 w-28 animate-pulse rounded-sm bg-muted"></div>
        </div>
        <div class="mx-auto flex max-w-[640px] flex-col gap-4 px-4 pt-8 md:px-6">
          <div class="h-8 w-3/4 animate-pulse rounded-md bg-muted"></div>
          <div class="h-4 w-full animate-pulse rounded-sm bg-muted"></div>
          <div class="h-4 w-2/3 animate-pulse rounded-sm bg-muted"></div>
          <div class="mt-2 h-11 w-full animate-pulse rounded-lg bg-muted md:w-64"></div>
        </div>
        <div class="fixed inset-x-0 bottom-0 h-14 border-t border-border bg-card md:hidden"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
