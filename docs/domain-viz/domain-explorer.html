<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Domain map cashback</title>
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
  :root {
    color-scheme: light;
    /* Neutrals, type, radii, shadows, motion: Stripe's real tokens (OpenDesign, opendesign.cc/packs/stripe). */
    --paper: #F8FAFD; --surface: #FFFFFF; --sunk: #E5EDF5; --line: #E5EDF5; --line-soft: rgba(229,237,245,.6);
    --ink: #061B31; --ink-2: #50617A; --muted: #64748D; --accent: #533AFD; --rule: rgba(6,27,49,.18);
    --shadow-rest: 0 3px 6px rgba(23,23,23,.06); --shadow-lift: 0 15px 35px rgba(23,23,23,.08);
    --ease: cubic-bezier(.25,1,.5,1);
    /* EventStorming sticky grammar — information, not decoration. */
    --event: #8C430A; --event-soft: #FDF1E4; --event-edge: #F0CFA8;
    --cmd: #16458C;   --cmd-soft: #E8F0FC;   --cmd-edge: #B8D0F0;
    --agg: #6F5309;   --agg-soft: #FBF3DC;   --agg-edge: #EBD9A6;
    --policy: #543596;--policy-soft: #F3EFFC;--policy-edge: #D8CBF2;
    --lang: #0C5E46;  --lang-soft: #E1F3EC;  --lang-edge: #A9DCC9;
    --hot: #B32C63;   --hot-soft: #FBE6EE;   --hot-edge: #F2C9D9;
    --svc: #1F5FBF; --read: #4A5A6B;
    --core: #11795A; --supporting: #9A7310; --generic: #5A6472;
    --sans: "Instrument Sans", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
    --rail-w: 264px; --top-h: 56px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.5; }
  button, select { font: inherit; color: inherit; } button { cursor: pointer; }
  a { color: var(--accent); }
  a, button { transition: color .22s var(--ease), background-color .22s var(--ease), border-color .22s var(--ease), box-shadow .22s var(--ease), opacity .22s var(--ease); }
  h1, h2, h3, h4 { margin: 0; text-wrap: balance; font-weight: 500; letter-spacing: -.01em; }
  p { margin: 0; } ul { margin: 0; padding-left: 18px; }
  code { font-family: var(--mono); font-size: .86em; }
  .mono { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  :where(a, button, summary):focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

  /* ---------- frame ---------- */
  .topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 8; height: var(--top-h); background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; padding: 0 24px; }
  .brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
  .mark { width: 26px; height: 26px; border-radius: 6px; background: var(--ink); color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 13px; }
  .crumbs { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; min-width: 0; }
  .crumbs a { color: var(--muted); text-decoration: none; } .crumbs a:hover { color: var(--ink); }
  .crumbs .cur { color: var(--ink); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .crumbs .sep { color: var(--rule); }
  .topmeta { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; line-height: 1; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 12.5px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
  .chip.core { color: var(--core); border-color: var(--lang-edge); background: var(--lang-soft); }
  .chip.supporting { color: var(--supporting); border-color: var(--agg-edge); background: var(--agg-soft); }
  .chip.generic, .chip.unknown { color: var(--generic); background: var(--sunk); border-color: transparent; }
  .chip.hot { color: var(--hot); background: var(--hot-soft); border-color: var(--hot-edge); }
  .chip.quiet { color: var(--muted); border-color: transparent; background: transparent; padding: 0; height: auto; font-weight: 400; }
  .chip.up { text-transform: uppercase; letter-spacing: .07em; font-size: 11px; font-weight: 600; }
  .chip .dot { width: 7px; height: 7px; border-radius: 50%; }

  .layout { display: grid; grid-template-columns: var(--rail-w) minmax(0, 1fr); align-items: start; }
  .rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-h)); height: calc(100vh - var(--top-h)); overflow-y: auto; background: var(--surface); border-right: 1px solid var(--line); padding: 14px 12px 32px; }
  .rail-head { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 16px 12px 6px; }
  .rail-group { display: flex; flex-direction: column; gap: 1px; }
  .rail-group:first-child .rail-head { padding-top: 0; }
  .rail-item { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 36px; text-align: left; border: 0; background: transparent; border-radius: 6px; padding: 7px 12px; color: var(--ink-2); font-size: 14px; line-height: 1.3; }
  .rail-item:hover { background: var(--paper); color: var(--ink); }
  .rail-item[aria-current="true"] { background: var(--sunk); color: var(--ink); font-weight: 500; }
  .rail-name { flex: 1 1 auto; min-width: 0; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; background: var(--generic); }
  .dot.core { background: var(--core); } .dot.supporting { background: var(--supporting); }
  .ring { flex: none; width: 16px; height: 16px; }
  .ring circle { fill: none; stroke-width: 3; }
  .ring .bg { stroke: var(--sunk); } .ring .fg { stroke: var(--ink-2); stroke-linecap: butt; transform: rotate(-90deg); transform-origin: 50% 50%; }

  .main { padding: 32px 40px 96px; min-width: 0; }
  .wrap { display: flex; flex-direction: column; gap: 40px; }

  /* ---------- section rhythm ---------- */
  .sec { display: flex; flex-direction: column; gap: 14px; scroll-margin-top: calc(var(--top-h) + 64px); }
  .sec-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .sec-head h2 { font-size: 20px; }
  .sec-head .why { font-size: 14px; color: var(--muted); }
  .sec-head .n { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 22px 24px; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(360px, 100%), 1fr)); gap: 14px; }
  .lbl { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .empty { border: 1px dashed var(--rule); border-radius: 8px; padding: 18px 20px; color: var(--muted); font-size: 14.5px; background: var(--surface); }
  .empty b { color: var(--ink-2); font-weight: 500; }
  .tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th { text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--paper); }
  td { padding: 10px 14px; border-bottom: 1px solid var(--line-soft); color: var(--ink-2); vertical-align: top; }
  tr:last-child td { border-bottom: 0; } td.k { font-family: var(--mono); font-size: 12.5px; color: var(--ink); white-space: nowrap; }
  details.fold > summary { cursor: pointer; list-style: none; display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--ink-2); padding: 6px 0; }
  details.fold > summary::-webkit-details-marker { display: none; }
  details.fold > summary::before { content: "▸"; color: var(--muted); font-size: 11px; } details.fold[open] > summary::before { content: "▾"; }
  details.fold > summary:hover { color: var(--ink); }

  /* ---------- landscape ---------- */
  .hero { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 24px; }
  .hero h1 { font-size: clamp(28px, 3.2vw, 36px); line-height: 1.05; letter-spacing: -.02em; }
  .hero .sub { color: var(--ink-2); font-size: 16px; margin-top: 6px; max-width: 70ch; }
  .hero .meta { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .stats { display: flex; gap: 28px; flex-wrap: wrap; }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat b { font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .stat span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }

  .smap { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 0; }
  .smap svg.edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
  .edges path { fill: none; stroke-width: 1.4; opacity: .32; transition: opacity .22s var(--ease), stroke-width .22s var(--ease); }
  .edges .e-port { stroke: var(--svc); } .edges .e-event { stroke: #C25E0A; stroke-dasharray: 5 3; } .edges .e-reference { stroke: var(--rule); } .edges .e-external { stroke: var(--generic); stroke-dasharray: 2 3; }
  .edges .target { opacity: .45; }
  .smap.focus .edges path { opacity: .06; } .smap.focus .edges path.on { opacity: 1; stroke-width: 2; }
  .band { position: relative; display: grid; grid-template-columns: 136px minmax(0, 1fr); align-items: start; padding: 18px 24px 18px 0; border-top: 1px solid var(--line-soft); }
  .band:first-of-type { border-top: 0; }
  .band-label { display: flex; flex-direction: column; gap: 4px; padding-left: 24px; }
  .band-label b { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
  .band-label span { font-size: 12px; color: var(--muted); line-height: 1.35; }
  .band.core .band-label b { color: var(--core); } .band.supporting .band-label b { color: var(--supporting); } .band.generic .band-label b { color: var(--generic); }
  .tiles { display: flex; flex-wrap: wrap; gap: 12px; position: relative; z-index: 1; }
  .tile { position: relative; width: 196px; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px 12px; display: flex; flex-direction: column; gap: 8px; box-shadow: var(--shadow-rest); }
  .tile:hover { box-shadow: var(--shadow-lift); border-color: var(--rule); }
  .tile.target { border-style: dashed; box-shadow: none; }
  .tile::before { content: ""; position: absolute; left: 14px; right: 14px; top: 0; height: 2px; border-radius: 0 0 2px 2px; background: var(--generic); }
  .tile.core::before { background: var(--core); } .tile.supporting::before { background: var(--supporting); }
  .tile h3 { font-size: 14.5px; line-height: 1.25; }
  .tile .addon { font-family: var(--mono); font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 12px; color: var(--muted); }
  .smap.focus .tile { opacity: .45; } .smap.focus .tile.on { opacity: 1; }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 12.5px; color: var(--muted); padding: 2px 4px; }
  .legend i { display: inline-block; width: 22px; height: 0; border-top: 2px solid var(--svc); vertical-align: middle; margin-right: 6px; }
  .legend i.ev { border-top-style: dashed; border-color: #C25E0A; } .legend i.ref { border-color: var(--rule); } .legend i.tg { border-color: var(--rule); border-top-style: dashed; }

  .hot { background: var(--surface); border: 1px solid var(--line); border-left: 3px solid var(--hot); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 5px; }
  .hot p { font-size: 15px; line-height: 1.45; color: var(--ink); }
  .hot .sub { font-size: 13px; color: var(--ink-2); }
  .hot .sub b { color: var(--hot); font-weight: 600; }

  /* ---------- dossier header ---------- */
  .dhead { display: flex; flex-direction: column; gap: 14px; }
  .dhead .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .dhead h1 { font-size: clamp(28px, 3.2vw, 38px); line-height: 1.05; letter-spacing: -.02em; }
  .dhead .cap { font-size: 17px; color: var(--ink-2); max-width: 78ch; }
  .cover { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 4px; }
  .cover a { display: flex; flex-direction: column; gap: 6px; text-decoration: none; color: var(--ink-2); font-size: 11.5px; font-weight: 500; letter-spacing: .02em; }
  .cover a i { display: block; height: 4px; border-radius: 2px; background: var(--ink-2); }
  .cover a.gap { color: var(--muted); } .cover a.gap i { background: var(--sunk); }
  .cover a:hover { color: var(--ink); }
  .cover a span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chipnav { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--top-h)); z-index: 6; background: rgba(248,250,253,.96); backdrop-filter: blur(8px); margin: 0 -40px; padding: 10px 40px; border-bottom: 1px solid var(--line); display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .chipnav::-webkit-scrollbar { display: none; }
  .chipnav a { flex: none; text-decoration: none; color: var(--ink-2); font-size: 13.5px; font-weight: 500; padding: 6px 12px; border-radius: 6px; }
  .chipnav a:hover { background: var(--sunk); color: var(--ink); }
  .chipnav a .n { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-left: 5px; }

  /* ---------- canvas ---------- */
  .canvas { display: grid; grid-template-columns: minmax(220px, 1fr) minmax(300px, 1.6fr) minmax(220px, 1fr); gap: 14px; align-items: stretch; }
  .cv { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
  .cv.in { border-top: 3px solid var(--cmd); } .cv.out { border-top: 3px solid #C25E0A; } .cv.mid { border-top: 3px solid var(--ink); }
  .cv h3 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; align-items: baseline; }
  .cv h3 small { font-family: var(--mono); font-size: 11px; letter-spacing: 0; text-transform: none; }
  .msg { display: flex; flex-direction: column; gap: 3px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--paper); }
  .msg.cmd { background: var(--cmd-soft); border-color: var(--cmd-edge); } .msg.ev { background: var(--event-soft); border-color: var(--event-edge); }
  .msg b { font-family: var(--mono); font-size: 12.5px; font-weight: 500; color: var(--ink); word-break: break-word; }
  .msg span { font-size: 12.5px; color: var(--ink-2); }
  .msg .who { font-size: 12px; color: var(--muted); }
  .kv { display: flex; flex-direction: column; gap: 4px; }
  .kv .lbl { margin-bottom: 2px; } .kv p { font-size: 15px; line-height: 1.5; color: var(--ink); }
  .terms { display: flex; flex-wrap: wrap; gap: 6px; }
  .term { font-family: var(--mono); font-size: 12px; padding: 4px 8px; border-radius: 4px; background: var(--lang-soft); color: var(--lang); border: 1px solid var(--lang-edge); }
  .rulelist { display: flex; flex-direction: column; gap: 8px; }
  .rule { display: grid; grid-template-columns: 92px 1fr; gap: 10px; font-size: 14px; line-height: 1.45; color: var(--ink); padding: 8px 0; border-top: 1px solid var(--line-soft); }
  .rule:first-child { border-top: 0; padding-top: 0; }
  .rule .kind { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--policy); font-weight: 600; padding-top: 3px; }

  /* ---------- aggregates ---------- */
  .aggs { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(380px, 100%), 1fr)); gap: 14px; }
  .agg { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px; }
  .agg .top { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .agg h3 { font-size: 19px; flex-grow: 1; }
  .agg .res { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .agg p.desc { font-size: 14.5px; color: var(--ink-2); line-height: 1.5; }
  .key { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: start; background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .key .tag { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; color: var(--ink-2); padding-top: 3px; }
  .key b { font-family: var(--mono); font-size: 13px; font-weight: 500; color: var(--ink); }
  .key span { display: block; font-size: 13px; color: var(--ink-2); margin-top: 2px; }
  .key.none { border-style: dashed; border-color: var(--hot-edge); background: var(--hot-soft); } .key.none b { color: var(--hot); }
  .bound { font-size: 14.5px; line-height: 1.5; color: var(--ink); padding-left: 12px; border-left: 2px solid var(--ink); }
  .inv { font-size: 14px; color: var(--ink-2); display: flex; flex-direction: column; gap: 4px; }
  .inv li { padding-left: 2px; }
  .fields { display: flex; flex-wrap: wrap; gap: 5px; }
  .fld { font-family: var(--mono); font-size: 11.5px; padding: 3px 7px; border-radius: 4px; border: 1px solid var(--line); background: var(--paper); color: var(--ink-2); }
  .fld.ref { border-color: var(--cmd-edge); color: var(--cmd); }

  /* ---------- lifecycle / diagrams ---------- */
  .lc { display: flex; flex-direction: column; gap: 10px; }
  .lc .t { display: flex; align-items: baseline; gap: 10px; } .lc .t h3 { font-size: 16px; } .lc .t code { color: var(--muted); }
  .diagram { margin: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; overflow-x: auto; }
  .diagram pre.mmd { margin: 0; font-family: var(--mono); font-size: 12px; color: var(--muted); white-space: pre; }
  .diagram svg { max-width: 100%; height: auto; display: block; margin: 0 auto; }
  .diagram figcaption { font-size: 12.5px; color: var(--muted); padding-top: 8px; }
  .kind { border-radius: 4px; padding: 2px 7px; font-family: var(--mono); font-size: 11px; font-weight: 500; }
  .kind.policy { background: var(--policy-soft); color: var(--policy); } .kind.event { background: var(--event-soft); color: var(--event); }
  .kind.cmd, .kind.svc { background: var(--cmd-soft); color: var(--cmd); } .kind.agg { background: var(--agg-soft); color: var(--agg); }
  .kind.lang { background: var(--lang-soft); color: var(--lang); } .kind.read { background: var(--sunk); color: var(--read); } .kind.hot { background: var(--hot-soft); color: var(--hot); }

  /* ---------- EventStorming strip ---------- */
  .strip { display: flex; flex-direction: column; gap: 10px; }
  .sentence { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 0; border-top: 1px solid var(--line-soft); }
  .sentence:first-child { border-top: 0; padding-top: 0; }
  .sn { border-radius: 4px; padding: 9px 12px; font-family: var(--mono); font-size: 13px; border: 1px solid; box-shadow: 0 1px 0 rgba(6,27,49,.06); }
  .sn.cmd { background: var(--cmd-soft); color: var(--cmd); border-color: var(--cmd-edge); }
  .sn.agg { background: var(--agg-soft); color: var(--agg); border-color: var(--agg-edge); font-family: var(--sans); font-weight: 500; }
  .sn.ev { background: var(--event-soft); color: var(--event); border-color: var(--event-edge); }
  .sn[data-role]::before { content: attr(data-role); display: block; font-family: var(--sans); font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; opacity: .65; margin-bottom: 3px; }
  abbr.ref { text-decoration: underline dotted; text-underline-offset: 2px; cursor: help; color: var(--ink); font-weight: 500; }
  .refgist { color: var(--muted); font-size: .92em; }
  .glossary table td:first-child { font-weight: 500; color: var(--ink); white-space: nowrap; }
  .sn.mute { background: var(--surface); color: var(--muted); border-color: var(--line); border-style: dashed; }
  .arrow { color: var(--rule); font-size: 16px; }
  .then { font-size: 13px; color: var(--muted); font-style: italic; }

  /* ---------- blocks ---------- */
  .bgroup { display: flex; flex-direction: column; gap: 8px; }
  .bgroup-head { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; } .bgroup-head .why { font-size: 13px; color: var(--muted); }
  .bgroup-n { font-family: var(--mono); font-size: 11px; color: var(--muted); }
  .brows { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .brow { display: flex; flex-direction: column; gap: 4px; padding: 12px 16px 12px 14px; border-left: 3px solid var(--rule); border-bottom: 1px solid var(--line-soft); }
  .brow:last-child { border-bottom: 0; }

":"LOCKED","action":"unlock","to":"ACTIVE","description":"The lock ends after 15 minutes.","reversible":true},{"from":"ACTIVE","action":"disable","to":"DISABLED","description":"Staff disable the account. It can no longer sign in.","reversible":true},{"from":"ACTIVE","action":"merge_into","to":"MERGED","description":"The operator merges a duplicate into the surviving customer. Its ids become aliases.","guards":["identity.customer.merge-same-bank"],"emits":["identity.customer.merged"]},{"from":"ACTIVE","action":"erase","to":"ERASED","description":"The operator erases the customer and the customer's history.","guards":["identity.customer.owed-not-erased"],"emits":["identity.customer.erased"]}]},"rules":[{"id":"identity.customer.created-from-zalo","description":"A customer is created only from Zalo intent: the first private message or the first product link pasted in the group (D25). The public web never creates a customer.","kind":"authorization","status":"observed","sources":["src/cashback/web/dashboard.py"]},{"id":"identity.customer.unknown-code-not-found","description":"An unknown customer code on the web is answered as not found. It never becomes a guest link.","kind":"policy","status":"observed"},{"id":"identity.customer.lookup-any-form","description":"A customer is found by customer code, customer id or alias, ignoring case and spaces.","kind":"specification","status":"observed"},{"id":"identity.customer.merge-same-bank","description":"Two customers with different bank accounts are never merged.","kind":"invariant","status":"observed","sources":["src/cashback/ledger/merge.py"]},{"id":"identity.customer.owed-not-erased","description":"A customer who is still owed money is not erased unless the operator forces it (D13).","kind":"invariant","status":"observed"},{"id":"identity.customer.bank-consent","description":"A bank account is saved only with the customer's consent time, and only the last four digits are shown.","kind":"policy","status":"observed"},{"id":"identity.customer.password-reissue-ends-sessions","description":"Issuing a new password ends every other session of that customer (D21).","kind":"policy","status":"target"},{"id":"identity.customer.root-admin-protected","description":"The root admin account cannot be demoted or disabled.","kind":"authorization","status":"observed"}],"events":["identity.customer.registered","identity.customer.bank-account-changed","identity.customer.merged","identity.customer.erased","identity.customer.locked"],"useCases":["identity.register-from-zalo","identity.sign-in","identity.issue-password","identity.save-bank-account","identity.merge-customers"]},{"id":"identity.session","name":"Session","resource":"sessions","status":"observed","domainRole":"generic","description":"A signed-in browser of a customer or staff member. Only a hash of the token is stored.","aggregateRoot":"identity.session","consistencyBoundary":"Must be correct together: token hash, owner and expiry.","invariants":["Only the hash of a session token is stored."],"fields":[{"name":"tokenHash","type":"TokenHash","kind":"primitive","identity":true,"required":true},{"name":"customerId","type":"CustomerId","kind":"reference","references":"identity.customer"},{"name":"expiresAt","type":"Instant","kind":"primitive"}],"rules":[{"id":"identity.session.sliding-expiry","description":"A session renews itself when it is used, so a customer stays signed in on a trusted phone.","kind":"policy","status":"observed"}]}],"events":[{"id":"identity.customer.registered","name":"CustomerRegistered","description":"A new customer was registered from Zalo. Linking may now issue links under the customer id.","producer":"identity.customer","consumers":["linking","messaging"],"status":"observed"},{"id":"identity.customer.bank-account-changed","name":"BankAccountChanged","description":"A customer saved or erased a bank account. Payouts read the new account; a recent change raises a review flag.","producer":"identity.customer","consumers":["payouts" at belongs to exactly one customer, and delivers it.","businessCapability":"Issue attributable affiliate links fast, without risking the affiliate accounts","strategicImportance":"high","contextMapPatterns":["anti-corruption-layer"],"aggregates":[{"id":"linking.link-request","name":"LinkRequest","resource":"link_requests","status":"observed","domainRole":"core","description":"One customer's request to turn one product URL into an affiliate link. It holds the source URL, the affiliate link, the share link and the estimate shown. It must never carry another customer's id.","aggregateRoot":"linking.link-request","consistencyBoundary":"Must be correct together: owner, network, source URL, affiliate link, sub_ids, share code, estimate and delivery time.","invariants":["A link request belongs to exactly one customer, written in sub_id1 (D6).","Every sub_id holds letters and digits only (D7).","An affiliate link is attached once and never replaced.","One share code belongs to one link request."],"buildingBlockIds":["bb.linking.link-request-root","bb.linking.sub-id","bb.linking.share-code","bb.linking.reuse-policy","bb.linking.link-queue","bb.linking.network-port"],"fields":[{"name":"requestId","type":"RequestId","kind":"primitive","identity":true,"required":true},{"name":"customerId","type":"CustomerId","kind":"reference","references":"identity.customer","required":true},{"name":"network","type":"AffiliateNetwork","kind":"primitive","enumValues":["shopee","tiktok","lazada","shopeefood"],"required":true},{"name":"channel","type":"Channel","kind":"primitive","enumValues":["zalo","web","house"],"required":true},{"name":"sourceUrl","type":"ProductUrl","kind":"value-object","required":true},{"name":"affiliateUrl","type":"AffiliateUrl","kind":"value-object"},{"name":"subIds","type":"SubIdSet","kind":"value-object","description":"sub_id1 is the customer id, sub_id2 the request id."},{"name":"shareCode","type":"ShareCode","kind":"primitive","description":"Eight random letters and ng.link-request.reuse-own-only","description":"A link is reused only for the same customer and the same source URL inside the attribution window. Product facts may be shared across customers.","kind":"policy","status":"observed"},{"id":"linking.link-request.house-one-per-product","description":"Guest requests reuse one HOUSE link per product (D5).","kind":"policy","status":"observed"},{"id":"linking.link-request.one-customer-per-batch","description":"One browser submission carries one customer only, because the network applies one sub_id to the whole batch (D7).","kind":"invariant","status":"observed"},{"id":"linking.link-request.attach-once","description":"A request that already has an affiliate link refuses another one, and a link already stored for a different source URL is refused as a stale page answer.","kind":"invariant","status":"observed"},{"id":"linking.link-request.late-delivery-window","description":"A late link is sent only between 55 seconds and 2 hours after it was issued. Older links are marked delivered without a message.","kind":"policy","status":"observed"},{"id":"linking.link-request.web-quota","description":"The website may issue 60 new links per hour in total and 20 per customer code per day. Zalo has no quota.","kind":"policy","status":"observed"},{"id":"linking.link-request.queue-priority","description":"The link queue serves Zalo first, then web customers, then guests, then the oldest request.","kind":"workflow","status":"observed"},{"id":"linking.link-request.real-browser-only","description":"Every call to Shopee goes through the operator's signed-in browser. No forged signatures, and commission lookups read page 1 only (D8).","kind":"policy","status":"observed"},{"id":"linking.link-request.share-link-in-chat","description":"Chat always delivers the share link, because purchases inside the Zalo in-app browser are not attributed.","kind":"policy","status":"observed"},{"id":"linking.link-request.link-never-expires","description":"An affiliate h customer earned which approved commission","strategicImportance":"high","contextMapPatterns":["anti-corruption-layer","published-language"],"aggregates":[{"id":"orders.order","name":"Order","resource":"orders","status":"observed","domainRole":"core","description":"One purchase a network reported, attributed to one customer. It holds the order value, the estimated and approved commission and the cashback owed. A paid order never changes.","aggregateRoot":"orders.order","consistencyBoundary":"Must be correct together: owner, network, status, estimated and approved commission, cashback, paid time and status history.","invariants":["Cashback is calculated from the approved commission only (D3).","An order with a paid time is never changed or paid again (D4).","An approved order is never rejected later.","A guest order always has 0 cashback and is never moved to another customer (D5).","Every status change is appended to the status history."],"buildingBlockIds":["bb.orders.order-root","bb.orders.attribution","bb.orders.reconciliation-run","bb.orders.report-acl","bb.money.commission-split"],"fields":[{"name":"orderId","type":"OrderId","kind":"primitive","identity":true,"required":true,"description":"The network's order number or transaction id."},{"name":"customerId","type":"CustomerId","kind":"reference","references":"identity.customer","required":true},{"name":"requestId","type":"RequestId","kind":"reference","references":"linking.link-request"},{"name":"network","type":"AffiliateNetwork","kind":"primitive","required":true},{"name":"status","type":"OrderStatus","kind":"primitive","enumValues":["awaiting_approval","frozen","approved","reversed","paid","rejected"],"required":true},{"name":"orderValue","type":"Money","kind":"value-object"},{"name":"estimatedCommission","type":"Money","kind":"value-object"},{"name":"approvedCommission","type":"Money","kind":"value-object"},{"name":"cashback","type":"Money","kind":"value-object","description":"Derived from the approved commission by the commission split."},{"name":"recordedAt","type":"Instant","kind":"primitive","description":"When the platform first recorded the order. Campaign ranking uses it."},{"name":"paidAt","type":"Instant","kind":"primitive"},{"name":"settlement","type":"SettlementStatus","kind":"primitive","enumValues":["unsettled","settled"],"description":"Whether the network has paid the operator for this order."},{"name":"productSnapshot","type":"ProductSnapshot","kind":"value-object","description":"Copied from the link request, or from the report row when there is no request (D56)."}],"lifecycle":{"stateType":"OrderStatus","kind":"state-machine","initial":"AWAITING_APPROVAL","description":"A recorded order waits for the network's approval, then waits for the operator's payout.","states":[{"name":"AWAITING_APPROVAL"},{"name":"FROZEN"},{"name":"APPROVED"},{"name":"REVERSED","terminal":true},{"name":"PAID"},{"name":"REJECTED"}],"transitions":[{"from":"AWAITING_APPROVAL","action":"approve","to":"APPROVED","description":"Reconciliation sees the network approve the order with a commission figure. The cashback becomes owed.","guards":["orders.order.approval-needs-commission"],"emits":["orders.order.approved"],"sideEffects":["The customer balance grows.","The customer is told the amount, without a payout date (D11)."]},{"from":"AWAITING_APPROVAL","action":"reject","to":"REJECTED","description":"Reconciliation sees a cancel signal through the network's status map. Shopee UNPAID is not one (D38).","emits":["orders.order.rejected"],"sideEffects":["The customer is told the reason."],"guards":["orders.order.network-status-map"]},{"from":"APPROVED","action":"mark_paid","to":"PAID","description":"A payout covering this order is recorded.","guards":["orders.order.pay-once"],"emits":["orders.order.paid"]},{"from":"AWAITING_APPROVAL","action":"freeze","to":"FROZEN","description":"The report carries an unknown status or no order id. A page-cap read fails the run and freezes nothing (D43)." {"id":"bb.identity.bank-account","name":"BankAccount","kind":"value-object","scope":"aggregate","context":"identity","purpose":"Bank, account number of 4 to 30 letters and digits, and upper-case holder name.","status":"observed","aggregate":"identity.customer"},{"id":"bb.identity.customer-merge","name":"CustomerMerge","kind":"domain-service","scope":"aggregate","context":"identity","purpose":"Merges a duplicate into the survivor and keeps the old ids as aliases.","status":"observed","aggregate":"identity.customer"},{"id":"bb.linking.link-request-root","name":"LinkRequest","kind":"aggregate-root","scope":"aggregate","context":"linking","purpose":"Owns one customer's link and guarantees it never carries another customer's id.","status":"observed","aggregate":"linking.link-request"},{"id":"bb.linking.sub-id","name":"SubId","kind":"domain-primitive","scope":"aggregate","context":"linking","purpose":"A tag of letters and digits only.","status":"observed","aggregate":"linking.link-request"},{"id":"bb.linking.share-code","name":"ShareCode","kind":"domain-primitive","scope":"aggregate","context":"linking","purpose":"Eight random letters and digits, one per request.","status":"observed","aggregate":"linking.link-request"},{"id":"bb.linking.reuse-policy","name":"LinkReusePolicy","kind":"policy","scope":"aggregate","context":"linking","purpose":"Decides whether a repeat request reuses the customer's own link or makes a fresh one.","status":"observed","aggregate":"linking.link-request"},{"id":"bb.linking.link-queue","name":"LinkQueue","kind":"process-manager","scope":"bounded-context","context":"linking","purpose":"Orders waiting requests by channel and age and feeds one customer per browser pass.","status":"observed"},{"id":"bb.linking.network-port","name":"AffiliateNetworkPort","kind":"port","scope":"integration","context":"linking","purpose":"Creates affiliate links and looks up product rates on one network.","status":"observed"},{"id":"bb.orders.order-root","name":"Order","kind":"aggregate-root","scope":"aggregate","context":"orders","purpose":"Owns an order's status, commission and cashback, and refuses any change after payment.","status":"observed","aggregate":"orders.order"},{"id":"bb.orders.attribution","name":"OrderAttribution","kind":"domain-service","scope":"aggregate","context":"orders","purpose":"Finds the customer of a report row by sub_id1, alias, then request owner.","status":"observed","aggregate":"orders.order"},{"id":"bb.orders.reconciliation-run","name":"ReconciliationRun","kind":"process-manager","scope":"bounded-context","context":"orders","purpose":"Reads each network report every hour and applies it idempotently.","status":"observed"},{"id":"bb.orders.report-acl","name":"ConversionReportTranslator","kind":"anti-corruption-layer","scope":"integration","context":"orders","purpose":"Translates each network's report rows and statuses into the Order language.","status":"observed"},{"id":"bb.money.commission-split","name":"CommissionSplit","kind":"shared-kernel","scope":"shared-kernel","context":"orders","purpose":"The one implementation of the cap, fee, tax, cashback share and half-up rounding, used by every context.","status":"observed"},{"id":"bb.payouts.payout-root","name":"Payout","kind":"aggregate-root","scope":"aggregate","context":"payouts","purpose":"Owns one transfer and the orders and bonuses it covers.","status":"observed","aggregate":"payouts.payout"},{"id":"bb.payouts.payable-balance","name":"PayableBalance","kind":"read-model","scope":"bounded-context","context":"payouts","purpose":"Each customer's approved, unpaid cashback and confirmed bonuses.","status":"observed"},{"id":"bb.payouts.vietqr-adapter","name":"VietQrAdapter","kind":"adapter","scope":"integration","context":"payouts","purpose":"Builds the transfer QR from the customer's bank account.","status":"observed"},{"id":"bb.payouts.bill-token","name":"BillToken","kind":"domain-primitive","scope":"aggregate","context":"payouts","purpose":"A 192-bit random token for the public bill page.","status":"observed","aggregate":"payouts.payout"},{"id":"bb.campaigns.campaign-root","name":"Campaign","kind":"aggregate-root","scope":"aggregate","context":"campaigns","purpose":"Owns the window, the slots and every award.","status":"observed","aggregate":"campaigns.campaign"},{"id":"bb.campaigns.slot-evaluation","name":"SlotEvaluation","kind":"domain-service","scope":"aggregate","context":"campaigns","purpose":"Fills free slots with the earliest qualifying orders while the campaign runs.","status":"observed","aggregate":"campaigns.campaign"},{"id":"bb.messaging.notifier","name":"Notifier","kind":"process-manager","scope":"bounded-context","context":"messaging","purpose":"Every 10 seconds sends what customers have not yet been told, with backoff.","status":"observed"},{"id":"bb.messaging.zalo-port","name":"ZaloAssistantPort","kind":"port","scope":"integration","context":"messaging","purpose":"Sends a private or group message through the assistant.","status":"observed"},{"id":"bb.messaging.message-catalog","name":"MessageCatalog","kind":"repository","scope":"bounded-context","context":"messaging","purpose":"The Vietnamese message texts, outside the code.","status":"observed"},{"id":"bb.linking.shopee-adapter","name":"ShopeeAdapter","kind":"anti-corruption-layer","scope":"integration","context":"linking","purpose":"Shopee links and commission lookups go through the operator's signed-in Chrome (D8). Via: Browser bridge.","status":"observed"},{"id":"bb.orders.shopee-adapter","name":"ShopeeReportAdapter","kind":"anti-corruption-layer","scope":"integration","context":"orders","purpose":"Shopee conversion reports are read page by page through the same browser. Via: Browser bridge report reader.","status":"observed"},{"id":"bb.linking.accesstrade-adapter","name":"AccessTradeAdapter","kind":"anti-corruption-layer","scope":"integration","context":"linking","purpose":"TikTok Shop links are created through AccessTrade with sub1 and sub2. Via: AccessTrade API.","status":"observed"},{"id":"bb.orders.accesstrade-adapter","name":"AccessTradeReportAdapter","kind":"anti-corruption-layer","scope":"integration","context":"orders","purpose":"AccessTrade transactions are grouped per order and translated. Via: AccessTrade transactions API.","status":"observed"},{"id":"bb.messaging.zalo-adapter","name":"ZcaJsAdapter","kind":"adapter","scope":"integration","context":"messaging","purpose":"All chat goes through one personal Zalo account (D9). Via: zca-js personal account.","status":"observed"}],"decisions":[{"id":"d1-whole-dong-half-up","decision":"Every amount is a whole number of dong. Money rounds half-up through one shared helper.","rationale":"Python round() and JS Math.round() round half to even or toward infinity; every tool in the market shows 9,263 for 9,262.5. Confirmed as carried over (OQ6); Delegated to Claude by the project owner on 2026-10-30 (recommended option).","status":"accepted","sources":[".context/decisions/2026-10-30-D1-whole-dong-half-up.md"]},{"id":"d2-commission-cap","decision":"Shopee's part of a commission is capped at 40,000 dong per order. The shop's XTRA part is not capped.","rationale":"Checked on 18 of 18 products. Forgetting the cap promised almost three times the real amount. Confirmed as carried over (OQ6); Delegated to Claude by the project owner on 2026-10-30 (recommended option).","status":"accepted","sources":[".context/decisions/2026-10-30-D2-commission-cap.md"]},{"id":"d3-approved-commission-only","decision":"Cashback is calculated from the approved commission only, never from the estimate shown to the customer.","rationale":"The estimate changes or disappears after returns; paying from it loses money. Confirmed as carried over (OQ6); Delegated to Claude by the project owner on 2026-10-30 (recommended option).","status":"accepted","sources":[".context/decisions/2026-10-30-D3-approved-commission-only.md"]},{"id":"d4-never-pay-twice","decision":"An order with a payout time (paid_at) is never changed or paid again.","rationale":"Reconciliation runs over overlapping periods; without this lock one order is paid two or three times. Confirmed as carried over (OQ6); Delegated to Claude by the project owner on 2026-10-30 (recommended option).","status":"accepted","sources":[".context/decisions/2026-10-30-D4-never-pay-twice.md"]},{"id":"d5-guest-no-cashback","decision":"A link made without a customer code belongs to the guest account HOUSE. A guest link never earns cashback, and its orders are never moved to a customer who registers later.","rationale":"All guests are the same payee, so one link per product is enough and the operator keeps the commission. Confirmed as carried over (OQ6); Delegated to Claude by the project owner on 2026-10-30 (recommended option).","status":"accepted","sources":[".context/decisions/2026-10-30-D5-guest-no-cashback.md"]},{"id":"d6-link-belongs-to-one-customer","decision":"A link belongs to exactly one customer through sub_id1. A link is reused only for the same customer; product facts (price, rates) may be shared.","rationale":"Reusing a link by product sent customer B's money to customer A in production (fixed on 2026-09-25). Confirmed as carried over (OQ6); Delegated to Claude by the project owner on 2026-10-30 (recommended option).","status":"accepted","sources":[".context/decisions/2026-10-30-D6-link-belongs-to-one-customer.md"]},{"id":"d7-sub-id-alphanumeric","decision":"Every sub_id holds letters and digits only, and one link batch never mixes customers.","rationale":"A dash silently breaks attribution; the network applies one sub_id to every link in a batch. Confirmed as carried over (OQ6); Delegated to Claude by the project owner on 2026-10-30 (recommended option).","status":"accepted","sources":[".context/decisions/2026-10-30-D7-sub-id-alphanumeric.md"]},{"id":"d8-real-browser-only","decision":"Every call to Shopee goes through the operator's real signed-in browser. No code rebuilds Shopee's signature headers or calls its internal APIs directly.","rationale":"The Open API was refused on 2026-09-10; direct calls put the whole session into captcha; forged signatures risk the affiliate account. Confirmed as carried over (OQ6); Delegated to Claude by the project owner on 2026-10-30 (recommended option).","status":"accepted","sources":[".context/decisions/2026-10-30-D8-real-browser-only.md"]},{"id":"d9-personal-zalo-human-pace","decision":"Customer chat runs on one personal Zalo account at a human pace. No bulk messages and no bulk friend requests.","rationale":"The Zalo Bot API is gone since 2026-09-25. A locked account cuts contact with every customer at once. Confirmed as carried over (OQ6); Delegated to Claude by the project owner on 2026-10-30 (recommended option).","status":"accepted","sources":[".context/decisions/2026-10-30-D9-personal-zalo-human-pace.md"]},{"id":"d10-only-assistant-creates-customers","decision":"Only the Zalo assistant creates customers. The public web signs in or accepts an existing code; an unknown code is not found.","rationale":"The assistant has just seen the person in Zalo; the web cannot prove who someone is. Confirmed as carried over (OQ6); Delegated to Claude by the project owner on 2026-10-30 (recommended option).","status":"accepted","sources":[".context/decisions/2026-10-30-D10-only-assistant-creates-customers.md"]},{"id":"d11-no-payout-threshold","decision":"Every approved, unpaid order is payable, grouped by customer. The operator decides when to pay, so no message promises a date.","rationale":"The old 50,000 dong threshold was a rule customers could not see or act on. Confirmed as carried over (OQ6); Delegated to Claude by the project owner on 2026-10-30 (recommended option).","status":"accepted","sources":[".context/decisions/2026-10-30-D11-no-payout-threshold.md"]},{"id":"d12-cashback-split","decision":"The approved commission is split as service fee 0.98%, withheld tax 10% in a withheld period, then net. Cashback is 80% of net; the operator keeps the rest.","rationale":"These are the rates the live system pays today. Confirmed as carried over (OQ6); Delegated to Claude by the project owner on 2026-10-30 (recommended option).","status":"accepted","sources":[".context/decisions/2026-10-30-D12-cashback-split.md"]},{"id":"d13-keep-customers-who-are-owed","decision":"A customer who is still owed money is never deleted, except by an explicit forced action of the operator.","rationale":"Deleting such a customer loses a debt the operator must still pay. Confirmed as carried over (OQ6); Delegated to Claude by the project owner on 2026-10-30 (recommended option).","status":"accepted","sources":[".context/decisions/2026-10-30-D13-keep-customers-who-are-owed.md"]},{"id":"d14-replan-from-scratch","decision":"The platform is re-planned from scratch: domain model, UX, architecture and PRD come before any code. The current Python system and the earlier v2 TypeScript code are reference only.","rationale":"The owner wants the web and the architecture redesigned and optimized; the earlier v2 design documents are not in the repository.","status":"accepted","sources":[".context/decisions/2026-10-30-D14-replan-from-scratch.md"]},{"id":"d15-english-everywhere","decision":"Code, docs, the domain model, decisions and logs are written in English. Chat follows the person's language. Customer-facing text is Vietnamese and lives only in the message and label files.","rationale":"One ubiquitous language in documents and code; customers read Vietnamese.","status":"accepted","sources":[".context/decisions/2026-10-30-D15-english-everywhere.md"]},{"id":"d16-commit-planning-docs","decision":"Planning documents (docs/, .context/, _bmad-output/) are committed. The GitHub repository is made private first.","rationale":"The earlier v2 design documents were lost because they were never committed.","status":"accepted","sources":[".context/decisions/2026-10-30-D16-commit-planning-docs.md"]},{"id":"d17-networks-first-release","decision":"The first release supports Shopee and TikTok Shop through AccessTrade. Lazada stays out until a later decision.","rationale":"Shopee and AccessTrade are live today; both entry points already refuse Lazada links. Delegated to Claude by the project owner on 2026-10-30 (recommended option).","status":"accepted","sources":[".context/decisions/2026-10-30-D17-networks-first-release.md"]},{"id":"d18-network-rules-in-linking","decision":"The Link Issuing context owns the affiliate network catalog: caps, sub_id format, link creation and report shape per network. Other contexts read it as published language.","rationale":"Network rules change together with link creation; one owner avoids two copies drifting, as the Shopee domain list once did. Delegated to Claude by the project owner on 2026-10-30 (recommended option).","status":"accepted","sources":[".context/decisions/2026-10-30-D18-network-rules-in-linking.md"]},{"id":"d19-one-payout-path","decision":"Every payout goes through one command. It covers only approved orders without a paid time and only confirmed bonuses, and it writes the order history.","rationale":"The live admin confirm-payment screen skips these checks and can pay awaiting or already-paid orders. Delegated to Claude by the project owner on 2026-10-30 (recommended option).","status":"accepted","sources":[".context/decisions/2026-10-30-D19-one-payout-path.md"]},{"id":"d20-commission-split-per-network","decision":"The commission split is one function in the shared money package, with a fee rate and a tax rule per network. The customer share is 80% of net on every network.","rationale":"Today Shopee, AccessTrade and the estimates each use a different formula. Delegated to Claude by the project owner on 2026-10-30 (recommended option).","status":"accepted","sources":[".context/decisions/2026-10-30-D20-commission-split-per-network.md"]},{"id":"d21-password-reissue-ends-sessions","decision":"Issuing a new password ends every other session of that customer.","rationale":"A customer who asks for a new password expects the old access to stop. Delegated to Claude by the project owner on 2026-10-30 (recommended option).","status":"accepted","sources":[".context/decisions/2026-10-30-D21-password-reissue-ends-sessions.md"]},{"id":"d22-campaigns-close","decision":"A campaign closes automatically at the end of its window, and the window end is exclusive everywhere.","rationale":"Today nothing closes a campaign and the v2 code disagreed with Python on the window end. Delegated to Claude by the project owner on 2026-10-30 (recommended option).","status":"accepted","sources":[".context/decisions/2026-10-30-D22-campaigns-close.md"]},{"id":"d23-no-expired-state","decision":"A link request has no expired state. Being outside the attribution window is derived from the request time.","rationale":"The expired state was bookkeeping only, misled readers into thinking the link stopped working, and its job ran only in one entry point. Delegated to Claude by the project owner on 2026-10-30 (recommended option).","status":"accepted","sources":[".context/decisions/2026-10-30-D23-no-expired-state.md"]},{"id":"d24-payout-void","decision":"An admin can void a payout recorded by mistake. The covered orders return to approved and their bonuses to confirmed, with history and audit. Reconciliation still never changes a paid order.","rationale":"A mistaken payout otherwise has no correction path; a compensating command keeps D4 intact for every automatic path. Delegated to Claude by the project owner on 2026-10-30 (recommended option, from the PRD review).","status":"accepted","sources":[".context/decisions/2026-10-30-D24-payout-void.md"]},{"id":"d25-registration-on-intent","decision":"The assistant registers a person on the first private message or the first product link pasted in the community group. Group membership alone registers no one.","rationale":"Most group members never request a link; registering them creates empty rows and noise in merges. Answers OQ7. Delegated to Claude by the project owner on 2026-10-30 (recommended option, from the PRD review).","status":"accepted","sources":[".context/decisions/2026-10-30-D25-registration-on-intent.md"]},{"id":"d26-erasure-keeps-ledger","decision":"Erasing a customer removes the personal data and keeps the orders, payouts and audit entries under the permanent customer id.","rationale":"Deleting ledger rows breaks D4 and the append-only audit trail; the privacy law needs the personal data gone, not the money record. Delegated to Claude by the project owner on 2026-10-30 (recommended option, from the PRD review).","status":"accepted","sources":[".context/decisions/2026-10-30-D26-erasure-keeps-ledger.md"]},{"id":"d27-one-payable-definition","decision":"Payable means approved and not paid, whether or not the network has settled it. Settlement is separate information. Every screen, chat reply and export uses this one definition.","rationale":"Today 'ready' has three definitions and the customer page, the customer list and the payments queue disagree. Delegated to Claude by the project owner on 2026-10-30 (recommended option, from the PRD review).","status":"accepted","sources":[".context/decisions/2026-10-30-D27-one-payable-definition.md"]},{"id":"d28-utc-storage-vietnam-days","decision":"Every instant is stored as UTC in one format. Business days, weeks, months and campaign windows are computed in Asia/Ho_Chi_Minh, and a date range includes its whole end day.","rationale":"Three stored time formats compared as text make date filters return nothing and campaigns open 7 hours late. Delegated to Claude by the project owner on 2026-10-30 (recommended option, from the PRD review).","status":"accepted","sources":[".context/decisions/2026-10-30-D28-utc-storage-vietnam-days.md"]},{"id":"d29-no-deals","decision":"The platform has no deals, featured products or food-and-drink vouchers. The Deals context, the /topdeal command and the deals pages are removed.","rationale":"The project owner removed the requirement on 2026-10-30. Fewer surfaces keep the website simple for customers.","status":"accepted","sources":[".context/decisions/2026-10-30-D29-no-deals.md"]},{"id":"d30-reverse-and-clawback","decision":"An order cancelled after approval and before payout becomes REVERSED and leaves every payout. An order cancelled after payout stays PAID and gets a clawback entry that is netted against the customer's next payout; an admin may write it off with a reason.","rationale":"Today a cancel after approval is silently skipped; the customer could be paid for a cancelled order. Asking customers to send money back loses them. Agreed in the status-flows party session; delegated by the project owner (recommended option).","status":"accepted","sources":[".context/decisions/2026-10-30-D30-reverse-and-clawback.md","docs/operations/status-flows.md"]},{"id":"d31-cancel-signal-precedence","decision":"A cancel signal is checked in a fixed order: order-level status, then each item, then a commission of 0. An unknown status, a missing order id or a report page cap freezes the order (FROZEN), excludes it from every total and opens a review case.","rationale":"The live reader uses only the first item's status, so a cancelled order stayed awaiting and was shown as money owed. Agreed in the status-flows party session; delegated by the project owner (recommended option).","status":"accepted","sources":[".context/decisions/2026-10-30-D31-cancel-signal-precedence.md","docs/operations/status-flows.md"]},{"id":"d32-confirm-rereads-orders","decision":"Payout confirmation re-reads every covered order inside the transaction and fails if any is not APPROVED, unpaid and owned by that customer. Awaiting money is never shown as owed, in any total, QR or selection.","rationale":"The live payments screen showed awaiting money by default and the confirm endpoint did not check status. Agreed in the status-flows party session; delegated by the project owner (recommended option).","status":"accepted","sources":[".context/decisions/2026-10-30-D32-confirm-rereads-orders.md","docs/operations/status-flows.md"]},{"id":"d33-keep-sqlite","decision":"The new platform keeps SQLite in WAL mode with the server as the only writer (AD-2). PostgreSQL only if a second writer process is ever needed.","rationale":"Low volume, one operator, one home machine; the live system already runs on SQLite. Approved by the project owner on 2026-10-30.","status":"accepted","sources":[".context/decisions/2026-10-30-D33-keep-sqlite.md"]},{"id":"d34-fr13-single-rounding","decision":"New approvals follow FR-13: cashback is the only rounding step (half-up). The live half-even rounding of fee and tax is retired; imported amounts stay unchanged.","rationale":"One formula everywhere; the difference is at most 1 dong per new approval. Delegated to Claude by the project owner on 2026-10-30 (recommended option, from the architecture run).","status":"accepted","sources":[".context/decisions/2026-10-30-D34-fr13-single-rounding.md"]},{"id":"d35-clawback-includes-bonus","decision":"A clawback after payout also recovers a campaign bonus already paid on that order.","rationale":"The bonus was paid only because the order was approved; it follows the order. Delegated to Claude by the project owner on 2026-10-30 (recommended option, from the architecture run).","status":"accepted","sources":[".context/decisions/2026-10-30-D35-clawback-includes-bonus.md"]},{"id":"d36-offsite-backup-drive","decision":"Encrypted backups go off the machine to Google Drive with rclone; the owner holds the age key. Cloudflare Access on the admin host allows only the owner's and staff accounts, listed outside the repository.","rationale":"Google Drive is already used for payout proofs; the key stays with the owner. Delegated to Claude by the project owner on 2026-10-30 (recommended option, from the architecture run).","status":"accepted","sources":[".context/decisions/2026-10-30-D36-offsite-backup-drive.md"]},{"id":"d37-dev-environment-first","decision":"A dev environment with its own Zalo account, ports, database and Chrome profile exists before the cutover rehearsal. Loss or compromise of the operator machine is accepted with full-disk encryption and a production-only OS account.","rationale":"Running dev against the production Zalo account kicks the assistant's session. Delegated to Claude by the project owner on 2026-10-30 (recommended option, from the architecture run).","status":"accepted","sources":[".context/decisions/2026-10-30-D37-dev-environment-first.md"]},{"id":"d38-shopee-unpaid-not-cancel","decision":"Every network adapter reads statuses through an explicit status map (raw value to AWAITING, APPROVED or CANCELLED; anything else is unknown and freezes the order), golden-tested on real report rows. Shopee UNPAID means the buyer has not paid yet and maps to AWAITING. Staff can move a wrongly REJECTED order back to AWAITING_APPROVAL through a review case when the latest report row shows no cancel signal.","rationale":"In the Shopee report UNPAID describes the buyer's payment, and the live reader maps it to awaiting; listing it as a cancel signal would reject normal and COD orders permanently (review C1). Delegated to Claude by the project owner on 2026-10-30 (recommended option, from the independent architecture review).","status":"accepted","sources":[".context/decisions/2026-10-30-D38-shopee-unpaid-not-cancel.md","_bmad-output/planning-artifacts/architecture/architecture-cashback-2026-10-30/review-independent.md"]},{"id":"d39-payout-claim-kept","decision":"Payout claims are kept with status OPEN, CONFIRMED or ABANDONED and a qr_shown_at time. Orders covered by an OPEN claim are not reversed: the cancel is recorded and applied by the first run after the claim ends. Confirm is idempotent by claim id and succeeds on an abandoned claim when no other claim is open and every covered order is unchanged. Each claim has its own transfer reference (customer code plus a short claim id), and opening a customer whose last claim was abandoned after the QR was shown warns that a transfer may already have been made.","rationale":"The operator transfers before confirming; refusing to record a transfer that already left the bank invites a second transfer (review C2). Delegated to Claude by the project owner on 2026-10-30 (recommended option, from the independent architecture review).","status":"accepted","sources":[".context/decisions/2026-10-30-D39-payout-claim-kept.md","_bmad-output/planning-artifacts/architecture/architecture-cashback-2026-10-30/review-independent.md"]},{"id":"d40-cutover-go-no-go-window","decision":"For 72 hours after the tunnel switch the new system records no payouts. Rollback to the live system is allowed only inside that window; after it the new system is final.","rationale":"Payouts, customers and share codes recorded only in the new system would be missing after a rollback, which reopens double payment; a no-payout window is simpler than a write-back tool for one operator (review C3). Delegated to Claude by the project owner on 2026-10-30 (recommended option, from the independent architecture review).","status":"accepted","sources":[".context/decisions/2026-10-30-D40-cutover-go-no-go-window.md","_bmad-output/planning-artifacts/architecture/architecture-cashback-2026-10-30/review-independent.md"]},{"id":"d41-void-restores-observed-state","decision":"Voiding a payout sets each covered order to the state transition() gives from its latest report row (REVERSED if a cancel was seen, else APPROVED), closes that order's clawback with an offsetting entry, reverses the netting entries the payout wrote, and returns bonuses to CONFIRMED, or VOID when their order is now REVERSED. All four combinations are golden-tested.","rationale":"Returning every covered order to APPROVED would make an order the network cancelled payable again (review H2). Delegated to Claude by the project owner on 2026-10-30 (recommended option, from the independent architecture review).","status":"accepted","sources":[".context/decisions/2026-10-30-D41-void-restores-observed-state.md","_bmad-output/planning-artifacts/architecture/architecture-cashback-2026-10-30/review-independent.md"]},{"id":"d42-clawback-entry-sum","decision":"A clawback's open amount is the sum of its insert-only ledger entries: the negative original (stored cashback plus any paid bonus, D35) and positive netting and write-off entries. A payout nets open clawbacks up to the gross payable and carries the rest forward; when the clawbacks cover the whole gross, a netting-only payout (transfer 0, no QR, no message) marks the orders paid. A merge moves no ledger entry; balances resolve through aliases. The payable balance is defined as the net figure and the deduction is shown to the customer.","rationale":"Ledger entries are insert-only, partial netting was undefined, and with a 0 floor a customer whose clawbacks exceeded the cashback could never be paid or cleared (review H3, M17). Delegated to Claude by the project owner on 2026-10-30 (recommended option, from the independent architecture review).","status":"accepted","sources":[".context/decisions/2026-10-30-D42-clawback-entry-sum.md","_bmad-output/planning-artifacts/architecture/architecture-cashback-2026-10-30/review-independent.md"]},{"id":"d43-reconciliation-read-window","decision":"The hourly reconciliation reads the last 7 days by purchase time. A nightly paced sweep reads, one day at a time with a page cap per slice, every day that still holds an awaiting or approved unpaid order; each order stores last_seen_in_report_at for aging. A read that hits a page cap fails the run and alerts the owner but freezes no order, which replaces the page-cap part of D31.","rationale":"Shopee approves 30 to 70 days after purchase; reading 90 days every hour exceeds the page cap or pages the report into captcha (review H4, M4). Delegated to Claude by the project owner on 2026-10-30 (recommended option, from the independent architecture review).","status":"accepted","sources":[".context/decisions/2026-10-30-D43-reconciliation-read-window.md","_bmad-output/planning-artifacts/architecture/architecture-cashback-2026-10-30/review-independent.md"]},{"id":"d44-cutover-shadow-parity","decision":"At cutover, paid totals per customer must match the live system to the dong. Payable and waiting amounts are checked by a shadow run of the new reconciliation on the rehearsal copy over the full report window, producing a per-order diff the owner signs off. Live payable is one named SQL in the cutover tool. An unresolved order older than the report can verify becomes FROZEN with a review case.","rationale":"The live payable figures carry known defects (three definitions of ready, the first-item-only status bug); parity with them would import cancelled orders as payable (review H5). Delegated to Claude by the project owner on 2026-10-30 (recommended option, from the independent architecture review).","status":"accepted","sources":[".context/decisions/2026-10-30-D44-cutover-shadow-parity.md","_bmad-output/planning-artifacts/architecture/architecture-cashback-2026-10-30/review-independent.md"]},{"id":"d45-cutover-time-provenance","decision":"The cutover import converts timestamps with a per-column table (column, source zone, fallback), each entry fixture-tested: CURRENT_TIMESTAMP columns are UTC, campaign windows are Vietnam time, dates synthesized from the order SN prefix are flagged approximate. A value that fits no rule is reported, never guessed.","rationale":"Live naive timestamps differ by column; one rule would move campaign windows, and so bonus slots, by 7 hours without an error (review H6). Delegated to Claude by the project owner on 2026-10-30 (recommended option, from the independent architecture review).","status":"accepted","sources":[".context/decisions/2026-10-30-D45-cutover-time-provenance.md","_bmad-output/planning-artifacts/architecture/architecture-cashback-2026-10-30/review-independent.md"]},{"id":"d46-cutover-quiet-first-run","decision":"The import seeds a dedup key as already sent for every event the live system already notified. The first reconciliation after import runs with messaging silent and reports the would-be sends. Proactive Zalo sends have a hard daily cap (default 150) with an owner alert when reached.","rationale":"New dedup keys and the stricter cancel rules would otherwise fire every notification at once on the personal Zalo account, which risks a lock on day one (review H7). Delegated to Claude by the project owner on 2026-10-30 (recommended option, from the independent architecture review).","status":"accepted","sources":[".context/decisions/2026-10-30-D46-cutover-quiet-first-run.md","_bmad-output/planning-artifacts/architecture/architecture-cashback-2026-10-30/review-independent.md"]},{"id":"d47-one-link-per-submission","decision":"The bridge submits one link per Shopee custom-link submission, with sub_id1 = customer id and sub_id2 = request id. One bridge job never holds two customers. The server checks the returned link's host against an allow-list and resolves its redirect to check the sub_ids before attaching it.","rationale":"sub_id cannot vary within a submission and links come back matched by position, so batches lose sub_id2 and can hand a link to the wrong request; the live code chose one link per submission for this reason (review H1, M16). Delegated to Claude by the project owner on 2026-10-30 (recommended option, from the independent architecture review).","status":"accepted","sources":[".context/decisions/2026-10-30-D47-one-link-per-submission.md","_bmad-output/planning-artifacts/architecture/architecture-cashback-2026-10-30/review-independent.md"]},{"id":"d48-admin-host-only-staff-api","decision":"The staff route group is registered only for the admin host, and every staff route verifies the Cloudflare Access JWT in addition to the staff session. Sign-in failures use a doubling delay per code instead of a fixed lock, Cloudflare rate-limit rules guard sign-in and link endpoints, and CF-Connecting-IP is only a rate-limit key.","rationale":"Both hostnames reach one public listener, so without a host check Access is bypassed through hoantiendp.com/api/admin (review H8, M10). Delegated to Claude by the project owner on 2026-10-30 (recommended option, from the independent architecture review).","status":"accepted","sources":[".context/decisions/2026-10-30-D48-admin-host-only-staff-api.md","_bmad-output/planning-artifacts/architecture/architecture-cashback-2026-10-30/review-independent.md"]},{"id":"d49-receipt-facts-only","decision":"The public receipt page shows customer code, last four digits, amount, date and voided state, never the proof image. Proof images are JPEG or PNG only, re-encoded with EXIF stripped, stored in a backed-up files directory, and served only to staff and the signed-in customer with a fixed content type, nosniff and a strict CSP.","rationale":"A proof is a bank screenshot with the full account number and holder, and an uploaded file on the customer origin is a stored-XSS vector (review H9, M12). Delegated to Claude by the project owner on 2026-10-30 (recommended option, from the independent architecture review).","status":"accepted","sources":[".context/decisions/2026-10-30-D49-receipt-facts-only.md","_bmad-output/planning-artifacts/architecture/architecture-cashback-2026-10-30/review-independent.md"]},{"id":"d50-external-heartbeat","decision":"The server pings an external heartbeat checker (healthchecks.io free tier or a Cloudflare Worker cron) that alerts the owner on Telegram when pings stop. The Mac never sleeps and restarts after power failure (pmset), sits on a UPS if possible, starts Chrome as a LaunchAgent, and the runbook covers the FileVault reboot.","rationale":"Every alert is sent by the same Mac, so power loss, sleep, an ISP outage or the FileVault pre-boot screen means total silence (review H10). Delegated to Claude by the project owner on 2026-10-30 (recommended option, from the independent architecture review).","status":"accepted","sources":[".context/decisions/2026-10-30-D50-external-heartbeat.md","_bmad-output/planning-artifacts/architecture/architecture-cashback-2026-10-30/review-independent.md"]},{"id":"d51-rotate-live-secrets-now","decision":"The owner rotates the two secrets committed on main now, in the live environment and in Cloudflare, without any code change on main, and makes the GitHub repository private. History scrubbing is left to the owner. The new platform never reuses those values.","rationale":"If the repository is public the secrets are exposed today, not at cutover; main is not touched by the re-plan (review H11, OQ8, D16). Delegated to Claude by the project owner on 2026-10-30 (recommended option, from the independent architecture review).","status":"accepted","sources":[".context/decisions/2026-10-30-D51-rotate-live-secrets-now.md","_bmad-output/planning-artifacts/architecture/architecture-cashback-2026-10-30/review-independent.md"]},{"id":"d52-fewer-moving-parts","decision":"Modules have a pure domain folder plus plain module files and http routes, without separate application and infrastructure layers; packages/time, packages/text and packages/domain merge into packages/core, and packages/money stays separate. An OS lock file and in-memory running flags replace job_leases and job_runs. The assistant pulls notifications from the internal listener and keeps a local sent-ids file instead of serving a loopback listener. Each backup is restore-checked automatically; a manual drill runs at cutover and quarterly.","rationale":"For about 30 orders a day and one developer, four layers, a PID lease, a second token boundary and a monthly manual drill add work without protecting against the real hazards (review S1 to S4). Delegated to Claude by the project owner on 2026-10-30 (recommended option, from the independent architecture review).","status":"accepted","sources":[".context/decisions/2026-10-30-D52-fewer-moving-parts.md","_bmad-output/planning-artifacts/architecture/architecture-cashback-2026-10-30/review-independent.md"]},{"id":"d53-v1-cutover-scope","decision":"The v1 cutover scope is what paying, attributing and reconciling depend on. Deferred until after cutover, without deleting the FRs: FR-27 metrics beyond the Overview line, FR-31 flags except the shared bank account, the FR-19 settlement screen, the FR-23 campaign creation UI, the FR-11 merge UI, the FR-24 staff UI, the FR-29 audit screen and the Guide redesign. Merge, campaign and staff work is done by admin command until then. The build follows a walking skeleton starting with money, the cutover import and shadow reconciliation.","rationale":"Cutover is big-bang, so the minimum cutover set bounds v1; none of the deferred items is on the pay, attribute or reconcile path (review section 6). Delegated to Claude by the project owner on 2026-10-30 (recommended option, from the independent architecture review).","status":"accepted","sources":[".context/decisions/2026-10-30-D53-v1-cutover-scope.md","_bmad-output/planning-artifacts/architecture/architecture-cashback-2026-10-30/review-independent.md"]},{"id":"d54-shopee-withheld-by-default","decision":"A Shopee settlement period counts as withheld (10% tax) unless staff unmark it. Unmarking affects only approvals after it; stored cashback is never recomputed.","rationale":"At 30 orders a day almost every Shopee period reaches the 2,000,000 dong withholding threshold, but staff learn it only after approval, so a not-withheld default makes the operator absorb the tax (review M1). Delegated to Claude by the project owner on 2026-10-30 (recommended option, from the independent architecture review).","status":"accepted","sources":[".context/decisions/2026-10-30-D54-shopee-withheld-by-default.md","_bmad-output/planning-artifacts/architecture/architecture-cashback-2026-10-30/review-independent.md"]},{"id":"d55-frozen-is-a-hold","decision":"A FROZEN order suspends its campaign award instead of voiding it; only REJECTED or REVERSED voids an award. An approved commission that drops but stays above 0 freezes an approved unpaid order for review and creates a partial clawback for a paid one.","rationale":"A transient unknown status should not cost the customer the bonus, and a partial refund after approval had no defined transition (review M2, M3). Delegated to Claude by the project owner on 2026-10-30 (recommended option, from the independent architecture review).","status":"accepted","sources":[".context/decisions/2026-10-30-D55-frozen-is-a-hold.md","_bmad-output/planning-artifacts/architecture/architecture-cashback-2026-10-30/review-independent.md"]},{"id":"d56-product-snapshot","decision":"A link request stores a product snapshot (name, image URL, price, rates) taken once at link creation. An order shows the snapshot of its link request; an order attributed without a request uses the name and image from the network report. No screen resolves product details at read time.","rationale":"The live system resolves name and image through four fallback lookups on every read, so lists show images inconsistently. The owner asked for product images on the order and dashboard screens. Owner request on 2026-10-30; snapshot design is the recommended option.","status":"accepted","sources":[".context/decisions/2026-10-30-D56-product-snapshot.md"]}],"openQuestions":[{"id":"oq1-storage","question":"Does the re-planned platform keep SQLite, or move to PostgreSQL?","impact":"Decides the migration path, backups and how many writers can run at once. Answered by the project owner on 2026-10-30 (keep SQLite): SQLite in WAL mode, one writer process (the server), BEGIN IMMEDIATE on every write, automatic off-machine backups; PostgreSQL only if a second writer process is needed. Recorded as AD-2 in the architecture spine (architecture-cashback-2026-10-30).","owner":"Architect, confirmed by the project owner","status":"resolved"},{"id":"oq2-stack","question":"Does the re-plan keep the TypeScript monorepo stack of the earlier v2 work (NestJS, Fastify, Drizzle, React)?","impact":"Decides how much of the main-v2 code can be reused. Answered by the architecture spine AD-3 (architecture-cashback-2026-10-30): keep the TypeScript pnpm monorepo; server on Fastify without NestJS, Drizzle, Zod; customer website and admin desk on React, Vite, Tailwind, shadcn/ui and TanStack; packages/money and its golden tests kept (split rewritten to FR-13); Zalo assistant stays a separate zca-js process; the Chrome MV3 bridge stays on a loopback endpoint with X-Bridge-Token.","owner":"Architect, confirmed by the project owner","status":"resolved"},{"id":"oq3-networks-in-scope","question":"Which affiliate networks are in the first release: Shopee only, or also TikTok Shop through AccessTrade and Lazada?","impact":"Decides whether the Affiliate Network port needs more than one adapter at launch. Answered by D17.","owner":"Project owner","status":"resolved"},{"id":"oq4-network-list-owner","question":"Who owns the network list when a new affiliate network is added?","impact":"Decides which context holds network rules such as caps, sub_id format and report shape. Answered by D18.","owner":"Architect","status":"resolved"},{"id":"oq5-v2-design-docs","question":"Does a copy of the earlier docs/architecture-v2 folder exist on another machine?","impact":"It would be useful reference input for the re-plan.","owner":"Project owner","status":"open"},{"id":"oq6-confirm-v1-rules","question":"Does the owner confirm D1 to D13, the rules carried over from the live system, as accepted for the new platform?","impact":"Until confirmed they stay proposed and the model treats them as candidates.","owner":"Project owner","status":"resolved"},{"id":"oq7-group-sync-creates-customers","question":"Should group membership sync keep creating a customer for every group member, or only people who write to the assistant?","impact":"Today every group member becomes a customer row; most never request a link. Answered by D25.","owner":"Project owner","status":"resolved"},{"id":"oq8-hardcoded-secrets","question":"When are the hard-coded deploy webhook secret and the third-party lookup key on main moved into the environment?","impact":"The repository may be public; both values are exposed now. Owner action now (D51): rotate both values in the live environment and in Cloudflare without code changes on main, and make the repository private.","owner":"Project owner","status":"open"}],"sources":["docs/index.md","docs/reference/v1-handover.vi.md","docs/reference/v2-agent-rules.md","docs/01-business","docs/02-architecture","docs/04-reference","src/cashback","zalo_assistant","apps/server/src/modules","docs/operations/status-flows.md"]};
