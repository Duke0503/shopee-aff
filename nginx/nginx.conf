events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Gzip compression for faster web UI loading
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream cashback_backend {
        # Inside Docker on Windows, host.docker.internal connects to the host machine (127.0.0.1:8899)
        server host.docker.internal:8899;
        # Note: If running Nginx natively on Windows (not Docker), change to:
        # server 127.0.0.1:8899;
    }

    server {
        listen 80;
        server_name _;

        # Client real IP headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / Connection upgrade support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # ------------------------------------------------------------------
        # 1. BẢO MẬT ADMIN & PAYOUTS:
        # /admin và /api/payouts chứa dữ liệu nhạy cảm (danh sách STK ngân hàng,
        # duyệt chuyển tiền, mã VietQR).
        # Mặc định: Mở cho localhost, mạng LAN nội bộ (192.168.1.0/24),
        # dải VPN Tailscale (100.64.0.0/10) và Docker bridge.
        # Muốn khóa hoàn toàn chỉ cho máy này vào: bỏ ghi chú 'deny all'.
        # ------------------------------------------------------------------
        location /admin {
            # allow 127.0.0.1;
            # allow 192.168.1.0/24;
            # allow 100.64.0.0/10;
            # deny all;

            proxy_pass http://cashback_backend;
        }

        location /api/payouts {
            # allow 127.0.0.1;
            # allow 192.168.1.0/24;
            # allow 100.64.0.0/10;
            # deny all;

            proxy_pass http://cashback_backend;
        }

        # ------------------------------------------------------------------
        # 2. KHÁCH TRUY CẬP (Public):
        # Trang chủ (/), Đăng nhập (/login), Tra cứu đơn (/orders),
        # và các API công khai của khách (/api/site, /api/auth/*, /api/me).
        # Mọi máy khác trong mạng đều vào được bình thường.
        # ------------------------------------------------------------------
        location / {
            proxy_pass http://cashback_backend;
        }
    }
}
