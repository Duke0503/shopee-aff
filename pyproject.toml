[project]
name = "cashback"
version = "0.1.0"
description = "Shopee affiliate cashback ledger and reconciliation"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
]

[project.scripts]
cashback = "cashback.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cashback"]
